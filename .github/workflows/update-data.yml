name: Uppdatera data

on:
  schedule:
    - cron: "17 3 * * *"   # varje natt ca 05:17 svensk tid
  workflow_dispatch:        # kan också köras manuellt under fliken Actions
  push:
    branches: [main]
    paths: ["data/*.json", "scripts/**", "templates/**"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python scripts/fetch_swedes.py
      - run: python scripts/fetch_matches.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - run: python scripts/fetch_squads.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - run: python scripts/fetch_nhl.py
      - run: python scripts/build.py
      - run: python scripts/render.py
      - name: Spara ändringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data/generated docs
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "Uppdatera data $(date -u +%Y-%m-%d)"
            git push
          fi
